<!-- @dsCard group="Screens" height=1370 width=1200 subtitle="Login, error, loading, forgot password, 2FA" -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<div id="r"></div>
<script>
const P=PisoWiFi,i=P.icon;
const login=(state)=>`
${state==='error'?`<div class="pw-banner bad" role="alert">${i('alert')}<div><strong>Invalid email or password.</strong> Check your details and try again. (Demo state)</div></div>`:''}
${P.field('Username or email','<input class="pw-input" value="operator@example.com">')}
${P.field('Password',`<div class="pw-input-wrap"><input class="pw-input" type="password" value="••••••••••" ${state==='error'?'':''}><button aria-label="Show password">${i('eye')}</button></div>`,'','',null)}
<div class="pw-row pw-between"><label class="pw-check"><span class="pw-box on">${i('check',14)}</span>Remember me</label><a href="#" style="font-weight:600;font-size:13px">Forgot password?</a></div>
<button class="pw-btn primary block ${state==='load'?'loading':''}">${state==='load'?'<span class="pw-spin"></span>Signing in…':'Sign in'}</button>`;
document.getElementById('r').innerHTML=`
<div class="pw-auth">
<div class="pw-auth-hero">
<div class="pw-row" style="gap:10px"><span class="pw-logo-mark" style="background:var(--on-hero);color:var(--hero)">${i('wifi',19)}</span><strong style="font-size:16px">PisoWiFi Monitoring</strong></div>
<div><div style="font:700 36px/42px var(--font-sans);letter-spacing:-.02em;max-width:440px">Know when your PisoWiFi is down.</div>
<p style="margin-top:16px;max-width:420px;opacity:.92;font-size:15px;line-height:24px">Monitor machines, review history and, in a later phase, reach each admin panel securely from one place.</p></div>
<div class="pw-small" style="opacity:.9">Prototype · Demo data · No real sign-in</div>
<svg class="rings" width="420" height="420" viewBox="0 0 420 420" fill="none" stroke="currentColor" stroke-width="14" stroke-linecap="round"><circle cx="210" cy="210" r="60"/><circle cx="210" cy="210" r="130"/><circle cx="210" cy="210" r="200"/></svg>
</div>
<div class="pw-auth-form"><div class="pw-auth-card">
<div><h2 style="font:650 26px/32px var(--font-sans);letter-spacing:-.015em">Welcome back</h2><p class="pw-muted" style="margin-top:6px">Sign in to your PisoWiFi Monitoring workspace.</p></div>
${login()}
<div class="pw-banner info" style="font-size:12px">${i('info',18)}<div>Prototype sign-in screen — no account is checked.</div></div>
</div></div></div>
<div style="padding:32px;background:var(--bg)"><div class="pw-grid pw-g3" style="gap:24px;align-items:start">
<div class="pw-card pw-stack"><span class="pw-label">Invalid login</span>${login('error')}</div>
<div class="pw-card pw-stack"><span class="pw-label">Loading</span>${login('load')}</div>
<div class="pw-card pw-stack"><span class="pw-label">Forgot password</span>
<div><h3 class="pw-h2">Reset your password</h3><p class="pw-muted" style="margin-top:6px">Enter your email and we'll send reset instructions (prototype — nothing is sent).</p></div>
${P.field('Email','<input class="pw-input" placeholder="you@example.com">')}
<button class="pw-btn primary block">${i('mail')}Send reset link</button>
<a href="#" style="font-weight:600;text-align:center">Back to sign in</a></div>
<div class="pw-card pw-stack" style="grid-column:1/3"><span class="pw-label">Verification · 2FA (future-ready, UI only)</span>
<div class="pw-grid pw-g2" style="align-items:center"><div><h3 class="pw-h2">Enter your 6-digit code</h3><p class="pw-muted" style="margin-top:6px">Open your authenticator app and type the current code. Two-factor sign-in is not enabled in this prototype.</p></div>
<div class="pw-stack" style="gap:12px"><div class="pw-otp"><div>4</div><div>8</div><div>2</div><div>·</div><div></div><div></div></div>
<div class="pw-row pw-between"><a href="#" style="font-weight:600;font-size:13px">Use a backup code</a><span class="pw-small pw-muted">Resend in 0:28</span></div>
<button class="pw-btn primary block">Verify</button></div></div></div>
<div class="pw-card pw-stack"><span class="pw-label">Code rejected</span>
<div class="pw-otp"><div>1</div><div>1</div><div>1</div><div>1</div><div>1</div><div>1</div></div>
<div class="pw-msg-err">${i('alert',14)}That code didn't work. Try again.</div></div>
</div></div>`;
</script>
