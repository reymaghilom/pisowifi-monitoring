<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>PisoWiFi Monitor App</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#f5f8f7;--surface:#ffffff;--surface-2:#ebf1ef;--border:#d5e0dd;--border-strong:#6b807c;--ink:#182626;--ink-muted:#4a5d5a;--brand:#0f766e;--brand-hover:#115e59;--on-brand:#ffffff;--hero:#0f766e;--hero-end:#134e4a;--on-hero:#ffffff;--brand-soft:#ddf2ee;--focus:#0d9488;--success:#2a7319;--success-soft:#e7f4df;--warning:#8f5200;--warning-soft:#fff1d6;--danger:#c01f33;--danger-soft:#fde6e9;--neutral:#576864;--neutral-soft:#e7edeb;--chart-1:#0d9488;--chart-2:#a14a00;--chart-grid:#e0e8e6;--shadow-sm:0 1px 2px rgba(18,38,38,0.06), 0 1px 1px rgba(18,38,38,0.04);--shadow-md:0 8px 24px rgba(18,38,38,0.10), 0 2px 6px rgba(18,38,38,0.06);--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:24px;--space-6:32px;--space-7:48px;--radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-xl:20px;--radius-pill:999px;--font-sans:"Inter", "Inter var", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;--font-mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#111c1b;--surface:#1c2b29;--surface-2:#243633;--border:#2f4542;--border-strong:#6e8a85;--ink:#e8f1ef;--ink-muted:#a6b8b4;--brand:#2dd4bf;--brand-hover:#5eead4;--on-brand:#0a1a18;--hero:#115e59;--hero-end:#0b2a27;--on-hero:#ffffff;--brand-soft:#14403b;--focus:#5eead4;--success:#8bdb6a;--success-soft:#1f3519;--warning:#f6bb48;--warning-soft:#392a0b;--danger:#ff808b;--danger-soft:#3a1720;--neutral:#9fb1ad;--neutral-soft:#263634;--chart-1:#2dd4bf;--chart-2:#ffa94d;--chart-grid:#283a37;--shadow-sm:0 1px 2px rgba(0,0,0,0.5);--shadow-md:0 10px 30px rgba(0,0,0,0.55);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111c1b;--surface:#1c2b29;--surface-2:#243633;--border:#2f4542;--border-strong:#6e8a85;--ink:#e8f1ef;--ink-muted:#a6b8b4;--brand:#2dd4bf;--brand-hover:#5eead4;--on-brand:#0a1a18;--hero:#115e59;--hero-end:#0b2a27;--on-hero:#ffffff;--brand-soft:#14403b;--focus:#5eead4;--success:#8bdb6a;--success-soft:#1f3519;--warning:#f6bb48;--warning-soft:#392a0b;--danger:#ff808b;--danger-soft:#3a1720;--neutral:#9fb1ad;--neutral-soft:#263634;--chart-1:#2dd4bf;--chart-2:#ffa94d;--chart-grid:#283a37;--shadow-sm:0 1px 2px rgba(0,0,0,0.5);--shadow-md:0 10px 30px rgba(0,0,0,0.55);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/22px var(--font-sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p{margin:0}
a{color:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.pw-ic{flex:none;display:inline-block;vertical-align:middle}
.pw-mono{font-family:var(--font-mono);font-size:13px;line-height:20px;font-weight:500}
.pw-muted{color:var(--ink-muted)}
.pw-small{font-size:12px;line-height:18px;font-weight:500}
.pw-label{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.pw-h1{font-size:26px;line-height:32px;font-weight:650;letter-spacing:-.015em}
.pw-h2{font-size:18px;line-height:26px;font-weight:600;letter-spacing:-.01em}
.pw-h3{font-size:15px;line-height:22px;font-weight:600}
.pw-kpi{font-size:30px;line-height:36px;font-weight:700;letter-spacing:-.02em}
.pw-row{display:flex;align-items:center;gap:var(--space-3)}
.pw-between{justify-content:space-between}
.pw-wrap{flex-wrap:wrap}
.pw-stack{display:flex;flex-direction:column;gap:var(--space-4)}
.pw-grow{flex:1;min-width:0}
.pw-grid{display:grid;gap:var(--space-5)}
.pw-g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pw-g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pw-g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.pw-g-main{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}

/* shell */
.pw-app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%;background:var(--bg)}
.pw-side{background:var(--surface);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:2px}
.pw-logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.pw-logo-mark{width:32px;height:32px;border-radius:var(--radius-md);background:var(--brand);color:var(--on-brand);display:grid;place-items:center}
.pw-nav{display:flex;flex-direction:column;gap:2px}
.pw-nav a{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border-radius:var(--radius-md);color:var(--ink-muted);text-decoration:none;font-weight:500}
.pw-nav a:hover{background:var(--surface-2);color:var(--ink)}
.pw-nav a[aria-current=page]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.pw-side-foot{margin-top:auto;padding:12px;border:1px dashed var(--border-strong);border-radius:var(--radius-lg);color:var(--ink-muted);font-size:12px;line-height:18px}
.pw-top{display:flex;align-items:center;gap:var(--space-3);padding:14px var(--space-6);background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}
.pw-search{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);color:var(--ink-muted);min-width:240px}
.pw-search input{border:0;outline:0;background:transparent;color:var(--ink);font:inherit;width:100%}
.pw-icon-btn{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);color:var(--ink);cursor:pointer}
.pw-icon-btn:hover{background:var(--surface-2)}
.pw-avatar{width:36px;height:36px;border-radius:var(--radius-pill);background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px}
.pw-page{padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-5);max-width:1280px}
.pw-page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap}

/* cards */
.pw-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--space-5)}
.pw-card.flat{box-shadow:none}
.pw-card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-4)}
.pw-stat{display:flex;flex-direction:column;gap:6px}
.pw-stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--ink-muted)}
.pw-stat-ic{width:36px;height:36px;border-radius:var(--radius-md);display:grid;place-items:center;background:var(--brand-soft);color:var(--brand)}
.pw-stat-ic.ok{background:var(--success-soft);color:var(--success)}
.pw-stat-ic.bad{background:var(--danger-soft);color:var(--danger)}
.pw-stat-ic.warn{background:var(--warning-soft);color:var(--warning)}
.pw-stat-ic.mute{background:var(--neutral-soft);color:var(--neutral)}

/* buttons */
.pw-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:var(--radius-md);border:1px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.pw-btn.primary{background:var(--brand);color:var(--on-brand)}
.pw-btn.primary:hover{background:var(--brand-hover)}
.pw-btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--border-strong)}
.pw-btn.secondary:hover{background:var(--surface-2)}
.pw-btn.ghost{background:transparent;color:var(--brand)}
.pw-btn.ghost:hover{background:var(--brand-soft)}
.pw-btn.danger{background:var(--danger);color:var(--on-brand)}
.pw-btn.danger-outline{background:var(--surface);color:var(--danger);border-color:var(--danger)}
.pw-btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.pw-btn.block{width:100%}
.pw-btn[disabled],.pw-btn.loading{opacity:.65;cursor:not-allowed}
.pw-spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:pwspin .8s linear infinite}
@keyframes pwspin{to{transform:rotate(360deg)}}

/* forms */
.pw-field{display:flex;flex-direction:column;gap:6px}
.pw-field>label{font-weight:600;font-size:13px}
.pw-input,.pw-select,.pw-textarea{width:100%;min-height:42px;padding:0 12px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);color:var(--ink);font:inherit}
.pw-textarea{padding:10px 12px;min-height:84px;resize:vertical}
.pw-input::placeholder{color:var(--ink-muted)}
.pw-input-wrap{position:relative}
.pw-input-wrap .pw-input{padding-right:44px}
.pw-input-wrap button{position:absolute;right:4px;top:3px;width:36px;height:36px;border:0;background:transparent;color:var(--ink-muted);border-radius:var(--radius-sm);cursor:pointer}
.pw-field.err .pw-input,.pw-field.err .pw-select{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.pw-field.ok .pw-input{border-color:var(--success);box-shadow:0 0 0 1px var(--success)}
.pw-help{font-size:12px;line-height:18px;color:var(--ink-muted)}
.pw-msg-err{font-size:12px;line-height:18px;color:var(--danger);display:flex;gap:6px;align-items:center;font-weight:500}
.pw-msg-ok{font-size:12px;line-height:18px;color:var(--success);display:flex;gap:6px;align-items:center;font-weight:500}
.pw-check{display:flex;align-items:center;gap:10px;cursor:pointer}
.pw-box{width:20px;height:20px;border:1.5px solid var(--border-strong);border-radius:5px;display:grid;place-items:center;background:var(--surface);color:var(--on-brand)}
.pw-box.on{background:var(--brand);border-color:var(--brand)}
.pw-toggle{width:44px;height:26px;border-radius:var(--radius-pill);background:var(--neutral-soft);border:1.5px solid var(--border-strong);position:relative;flex:none;cursor:pointer;padding:0}
.pw-toggle::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:var(--ink-muted);transition:transform .15s}
.pw-toggle.on{background:var(--brand);border-color:var(--brand)}
.pw-toggle.on::after{transform:translateX(18px);background:var(--on-brand)}
.pw-seg{display:inline-flex;padding:3px;gap:2px;background:var(--surface-2);border-radius:var(--radius-pill);border:1px solid var(--border)}
.pw-seg button{border:0;background:transparent;padding:6px 14px;border-radius:var(--radius-pill);font-weight:600;font-size:13px;color:var(--ink-muted);cursor:pointer}
.pw-seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
.pw-chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--ink)}
.pw-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto}
.pw-tabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;color:var(--ink-muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.pw-tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}

/* badges */
.pw-badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--radius-pill);font-size:12px;font-weight:600;white-space:nowrap}
.pw-badge.ok{background:var(--success-soft);color:var(--success)}
.pw-badge.bad{background:var(--danger-soft);color:var(--danger)}
.pw-badge.warn{background:var(--warning-soft);color:var(--warning)}
.pw-badge.info{background:var(--brand-soft);color:var(--brand)}
.pw-badge.mute{background:var(--neutral-soft);color:var(--neutral)}
.pw-badge.tag{border-radius:var(--radius-sm);border:1px dashed currentColor;background:transparent}

/* banners / toasts */
.pw-banner{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--radius-lg);border:1px solid var(--border);font-size:13px;line-height:20px}
.pw-banner.info{background:var(--brand-soft);color:var(--ink);border-color:transparent}
.pw-banner.info>.pw-ic{color:var(--brand)}
.pw-banner.warn{background:var(--warning-soft);color:var(--ink);border-color:transparent}
.pw-banner.warn>.pw-ic{color:var(--warning)}
.pw-banner.bad{background:var(--danger-soft);color:var(--ink);border-color:transparent}
.pw-banner.bad>.pw-ic{color:var(--danger)}
.pw-banner.ok{background:var(--success-soft);color:var(--ink);border-color:transparent}
.pw-banner.ok>.pw-ic{color:var(--success)}
.pw-toast{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);max-width:380px}

/* table */
.pw-tablewrap{border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-sm)}
.pw-table{width:100%;border-collapse:collapse}
.pw-table th{text-align:left;padding:12px 16px;background:var(--surface-2);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);white-space:nowrap}
.pw-table td{padding:14px 16px;border-top:1px solid var(--border);vertical-align:middle}
.pw-table tbody tr:hover{background:var(--surface-2)}
.pw-actions{display:flex;gap:4px;justify-content:flex-end}
.pw-act{width:34px;height:34px;display:grid;place-items:center;border:0;background:transparent;border-radius:var(--radius-sm);color:var(--ink-muted);cursor:pointer}
.pw-act:hover{background:var(--surface-2);color:var(--ink)}
.pw-act.d:hover{background:var(--danger-soft);color:var(--danger)}

/* kv list */
.pw-kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 16px}
.pw-kv dt{color:var(--ink-muted);font-size:13px}
.pw-kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}

/* events / timeline */
.pw-events{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pw-events li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.pw-events li:first-child{border-top:0;padding-top:0}
.pw-ev-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none}
.pw-ev-ic.ok{background:var(--success-soft);color:var(--success)}
.pw-ev-ic.bad{background:var(--danger-soft);color:var(--danger)}
.pw-ev-ic.warn{background:var(--warning-soft);color:var(--warning)}
.pw-ev-ic.mute{background:var(--neutral-soft);color:var(--neutral)}
.pw-ev-ic.info{background:var(--brand-soft);color:var(--brand)}

/* skeleton / empty / modal */
.pw-skel{background:linear-gradient(90deg,var(--surface-2) 0%,var(--border) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:pwsh 1.4s linear infinite;border-radius:var(--radius-sm);height:14px}
@keyframes pwsh{to{background-position:-200% 0}}
.pw-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:var(--space-7) var(--space-5);border:1px dashed var(--border-strong);border-radius:var(--radius-lg);background:var(--surface)}
.pw-empty-ic{width:56px;height:56px;border-radius:var(--radius-xl);background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.pw-empty-ic.bad{background:var(--danger-soft);color:var(--danger)}
.pw-empty-ic.warn{background:var(--warning-soft);color:var(--warning)}
.pw-empty-ic.mute{background:var(--neutral-soft);color:var(--neutral)}
.pw-empty-ic.ok{background:var(--success-soft);color:var(--success)}
.pw-scrim{background:rgba(8,20,19,.55);display:grid;place-items:center;padding:24px;border-radius:var(--radius-lg)}
.pw-modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-md);padding:24px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:16px}

/* charts */
.pw-chart{width:100%;height:auto;display:block}
.pw-chart text{font:500 11px var(--font-sans);fill:var(--ink-muted)}
.pw-chart .grid{stroke:var(--chart-grid);stroke-width:1}
.pw-chart .l1{fill:none;stroke:var(--chart-1);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.pw-chart .l2{fill:none;stroke:var(--chart-2);stroke-width:2.5;stroke-dasharray:6 4;stroke-linejoin:round;stroke-linecap:round}
.pw-chart .a1{fill:var(--chart-1);opacity:.12}
.pw-chart .b1{fill:var(--chart-1)}
.pw-chart .b2{fill:var(--chart-2)}
.pw-chart .s-ok{fill:var(--success)}
.pw-chart .s-bad{fill:var(--danger)}
.pw-chart .s-warn{fill:var(--warning)}
.pw-chart .s-mute{fill:var(--border-strong)}
.pw-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;font-weight:500;color:var(--ink-muted)}
.pw-legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--chart-1)}
.pw-legend i.d2{background:repeating-linear-gradient(90deg,var(--chart-2) 0 6px,transparent 6px 9px)}
.pw-legend i.sq{height:10px;width:10px;border-radius:3px}

/* auth */
.pw-auth{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);min-height:640px;background:var(--bg)}
.pw-auth-hero{background:linear-gradient(155deg,var(--hero) 0%,var(--hero-end) 100%);color:var(--on-hero);padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.pw-auth-hero .rings{position:absolute;right:-120px;bottom:-120px;opacity:.18}
.pw-auth-form{display:flex;align-items:center;justify-content:center;padding:48px}
.pw-auth-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:20px}
.pw-otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pw-otp div{height:52px;border:1px solid var(--border-strong);border-radius:var(--radius-md);display:grid;place-items:center;font:600 20px var(--font-mono);background:var(--surface)}

/* remote admin placeholder */
.pw-browser{border:1px solid var(--border-strong);border-radius:var(--radius-lg);overflow:hidden;background:var(--surface)}
.pw-browser-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.pw-browser-url{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-pill);color:var(--ink-muted)}
.pw-stepper{display:flex;flex-direction:column;gap:0}
.pw-step{display:flex;gap:12px;padding-bottom:16px;position:relative}
.pw-step:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--border)}
.pw-step-dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--neutral-soft);color:var(--neutral);font-size:12px;font-weight:700}
.pw-step-dot.ok{background:var(--success-soft);color:var(--success)}
.pw-step-dot.now{background:var(--brand-soft);color:var(--brand)}
.pw-step-dot.bad{background:var(--danger-soft);color:var(--danger)}

/* phone frames */
.pw-phone{width:390px;border:8px solid var(--ink);border-radius:36px;overflow:hidden;background:var(--bg);position:relative;height:760px;display:flex;flex-direction:column}
.pw-mtop{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.pw-mbody{padding:16px;display:flex;flex-direction:column;gap:12px;overflow:hidden;flex:1}
.pw-drawer{position:absolute;inset:0;display:flex}
.pw-drawer-panel{width:280px;background:var(--surface);padding:16px 12px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:2px}
.pw-drawer-scrim{flex:1;background:rgba(8,20,19,.55)}
.pw-mcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow-sm)}

  /* LineChart({w,h,labels,series:[{v,cls}],min,max,ticks,unit,area}) → svg string */
  P.LineChart = P.line = function (o) {

    var s = '<svg class="pw-chart" viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + (o.alt || 'Sample chart') + '">';

      var v = min + (max - min) * t / ticks, y = Y(v);

      if (se.area) s += '<path class="a1" d="' + d + ' L' + X(n - 1) + ' ' + (T + ih) + ' L' + X(0) + ' ' + (T + ih) + ' Z"/>';

  };

  /* status strip: array of 'ok'|'bad'|'warn'|'mute' → one segmented bar */
  P.strip = function (arr, h) {

  P.events = [

    }).join('') + '</ul>';

<script>
(function(){
'use strict';
var P=PisoWiFi,I=P.icon,B=P.badge;
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var MIN=60000,HR=3600000,DAY=86400000;
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function pad(n){return (n<10?'0':'')+n}
function dShort(t){var d=new Date(t);return MON[d.getMonth()]+' '+d.getDate()}
function dTime(t){var d=new Date(t);return MON[d.getMonth()]+' '+d.getDate()+', '+pad(d.getHours())+':'+pad(d.getMinutes())}
function iso(t){var d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function ago(t){if(!t)return 'Never';var d=Math.max(0,Date.now()-t);if(d<60000)return 'just now';if(d<HR)return Math.round(d/MIN)+' min ago';if(d<DAY){var h=Math.floor(d/HR),m=Math.round((d-h*HR)/MIN);return h+' h'+(m?' '+m+' min':'')+' ago'}var n=Math.round(d/DAY);return n+' day'+(n>1?'s':'')+' ago'}
function dur(min){min=Math.round(min);if(min<60)return min+' min';var h=Math.floor(min/60),m=min%60;return h+' h'+(m?' '+m+' min':'')}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function startDay(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}

/* ---------- sample history (every number is invented) ---------- */
var HIST={};
function genHist(id,q,base,seed,dmax){
  var r=rng(seed),today=startDay(Date.now()),outs=[],ev=[];
  for(var i=29;i>=0;i--){
    var day=today-i*DAY,n=r()<q?(r()<.3?2:1):0;
    for(var k=0;k<n;k++){
      var s=day+Math.floor(r()*20*HR)+HR,d=Math.round(5+r()*dmax)*MIN,e=s+d;
      if(e>Date.now()-5*MIN)continue;
      outs.push({s:s,e:e});
      if(r()<.45)ev.push({t:s-15*MIN,m:id,type:'stale',st:'stale',msg:'No successful HTTP check for 15 min'});
      ev.push({t:s,m:id,type:'outage',st:'unreachable',dur:d/MIN,msg:'HTTP check timed out after 5 s'});
      ev.push({t:e,m:id,type:'recovery',st:'reachable',msg:'Admin interface reachable again after '+dur(d/MIN)});
    }
    if(r()<.05)ev.push({t:day+9*HR,m:id,type:'error',st:'error',msg:'Monitor could not complete the run (sample)'});
    if(i===20||i===9)ev.push({t:day+8*HR+30*MIN,m:id,type:'system',st:'unknown',msg:'Monitoring interval changed (sample)'});
  }
  ev=ev.filter(function(e){return e.t<Date.now()});
  HIST[id]={outs:outs,events:ev,base:base,seed:seed};
}
genHist('m1',.2,44,11,45);
genHist('m2',.5,102,29,70);
function downIn(id,a,b){var h=HIST[id],t=0;h.outs.forEach(function(o){var s=Math.max(o.s,a),e=Math.min(o.e,b);if(e>s)t+=(e-s)});return t/MIN}
function rtAt(id,t,down){var h=HIST[id],r=rng(Math.floor(t/HR)*7+h.seed);return Math.round(h.base*(0.88+r()*.3)+(down?h.base*.6:0))}
/* range -> bucketed points */
function points(id,range,from,to){
  var pts=[],now=Date.now(),i;
  if(range==='24'){var endH=Math.floor(now/HR)*HR;for(i=23;i>=0;i--){var a=endH-i*HR,b=a+HR;var dn=downIn(id,a,Math.min(b,now));pts.push({a:a,b:b,label:pad(new Date(a).getHours())+':00',up:100-dn/60*100,rt:rtAt(id,a,dn>0),down:dn,mins:60})}}
  else{var days=range==='custom'?Math.max(1,Math.round((startDay(to)-startDay(from))/DAY)+1):+range,last=range==='custom'?startDay(to):startDay(now);for(i=days-1;i>=0;i--){var a2=last-i*DAY,b2=a2+DAY,eb=Math.min(b2,now),mins=(eb-a2)/MIN;var dn2=downIn(id,a2,eb);var outN=HIST[id].outs.filter(function(o){return o.s>=a2&&o.s<b2}).length;pts.push({a:a2,b:b2,label:dShort(a2),up:100-dn2/Math.max(mins,1)*100,rt:rtAt(id,a2+12*HR,dn2>0),down:dn2,mins:mins,outs:outN})}}
  return pts;
}
function summarize(pts){var d=0,m=0,o=0,rt=0;pts.forEach(function(p){d+=p.down;m+=p.mins;o+=(p.outs||0);rt+=p.rt});return {down:d,up:100-d/Math.max(m,1)*100,outs:o,rt:pts.length?rt/pts.length:0}}

/* ---------- state ---------- */
var PRE={reachable:{zt:'recent',seen:1,ok:1},stale:{zt:'stale',seen:14,ok:180},unreachable:{zt:'recent',seen:2,ok:25},unknown:{zt:'unknown',seen:null,ok:null},error:{zt:'recent',seen:1,ok:120}};
function setStatus(m,st){var p=PRE[st];m.status=st;m.zt=p.zt;m.seenAt=p.seen==null?null:Date.now()-p.seen*MIN;m.okAt=p.ok==null?null:Date.now()-p.ok*MIN}
function mkM(o){var m=Object.assign({loc:'',desc:'',tags:[],ztNet:'',ztMember:'',hist:false,monitor:true,ver:''},o);setStatus(m,o.status||'unknown');return m}
var S={
  route:'login',auth:false,collapsed:false,drawer:false,menu:false,theme:'system',view:'normal',
  login:{email:'operator@example.com',pw:'demo',show:false,loading:false,err:'',fe:{}},

  machines:[
    mkM({id:'m1',name:'PisoWiFi 01',loc:'Location not set (demo)',sw:'WiFi5Soft',ver:'v3.5.84',ip:'192.168.194.82',path:'/admin',tags:['demo','primary'],hist:true,status:'reachable',did:'demo-m1-0001'}),
    mkM({id:'m2',name:'PisoWiFi 02',loc:'Location not set (demo)',sw:'WiFi5Soft',ver:'',ip:'192.168.194.127',path:'/admin',tags:['demo'],hist:true,status:'stale',did:'demo-m2-0002'})],
  sel:'m1',seq:2,
  mq:'',mstatus:'all',msort:'name',
  dash:{range:'14'},hide:{},
  hist:{m:'all',range:'14',from:'',to:'',status:'all',ev:'all',page:0},
  rep:{period:'weekly',sort:'up',dir:-1},
  remote:{m:'m1',phase:'idle',step:-1,attempt:1,outcome:'auto',session:false,fail:-1},
  auto:{tab:'rules',hf:'all',rule:'outage',rules:{outage:true,recovery:true,daily:false,weekly:false}},
  set:{sec:'profile',profile:{name:'Operator',email:'operator@example.com',err:{}},pw:{cur:'',nw:'',cf:'',err:{}},tfaOn:false,tfaSetup:false,tfaCode:'',tfaErr:'',
       mon:{interval:'60',timeout:'5',thr:'3',err:{}},notif:{email:false,tg:false,offline:true,recovery:true,quiet:false},
       sessions:[{id:'s1',name:'This browser',meta:'Sample · active now',cur:true},{id:'s2',name:'Phone',meta:'Sample · 2 days ago'},{id:'s3',name:'Laptop',meta:'Sample · 6 days ago'}]},
  extraEvents:[],modal:null,busy:false
};
try{var th=localStorage.getItem('pw-theme');if(th==='light'||th==='dark')S.theme=th}catch(e){}
function mById(id){return S.machines.filter(function(m){return m.id===id})[0]}
function selM(){return mById(S.sel)||S.machines[0]||null}
function addEvent(m,type,st,msg){S.extraEvents.push({t:Date.now(),m:m.id,type:type,st:st,msg:msg})}
function allEvents(){var a=[];S.machines.forEach(function(m){if(HIST[m.id])a=a.concat(HIST[m.id].events)});a=a.concat(S.extraEvents.filter(function(e){return mById(e.m)}));return a.sort(function(x,y){return y.t-x.t})}
function mName(id){var m=mById(id);return m?m.name:'Removed machine'}
var EVICON={outage:['bad','x'],recovery:['ok','check'],stale:['warn','alert'],error:['bad','alert'],system:['info','settings'],check:['info','refresh']};
var EVLABEL={outage:'Outage',recovery:'Recovery',stale:'Stale',error:'Monitoring error',system:'System',check:'Demo check'};
var STBADGE={unreachable:'unreachable',reachable:'reachable',stale:'stale',error:'error',unknown:'unknown',system:'unknown'};
var NAV=[['dash','dashboard','Dashboard'],['machines','server','My PisoWiFi'],['detail','pulse','Machine Details'],['remote','shield','Remote Administration'],['history','history','Monitoring History'],['reports','chart','Reports & Analytics'],['auto','zap','Automations / Integrations'],['settings','settings','Settings']];
var TITLES={dash:['Dashboard','Overview of your registered PisoWiFi machines'],machines:['My PisoWiFi','Register, edit and review machines'],detail:['Machine Details','Status, history and actions'],remote:['Remote Administration','Prototype only · not operational yet'],history:['Monitoring History','Checks, outages and events (sample data)'],reports:['Reports & Analytics','Reliability trends and summaries (sample data)'],auto:['Automations / Integrations','Future n8n and Telegram automation · Coming Soon'],settings:['Settings','Account, monitoring and integrations']};

/* ---------- charts ---------- */
var CH={};
function lineChart(id,cfg){CH[id]=cfg;return '<div class="cw" data-chart="'+id+'" data-kind="line" role="img" aria-label="'+esc(cfg.alt||'Sample chart')+'"></div>'}
function barChart(id,cfg){CH[id]=cfg;return '<div class="cw" data-chart="'+id+'" data-kind="bar" role="img" aria-label="'+esc(cfg.alt||'Sample bar chart')+'"></div>'}
function legend(id,series){return '<div class="pw-legend" style="margin-top:8px">'+series.map(function(s){var off=S.hide[id+s.id],bar=s.cls.charAt(0)==='b';return '<button type="button" data-act="legend" data-key="'+id+s.id+'" aria-pressed="'+(!off)+'" title="Show or hide '+esc(s.name)+'">'+(bar?'<i class="sq" style="background:var(--'+(s.cls==='b1'?'chart-1':'chart-2')+')"></i>':'<i class="'+(s.cls==='l2'?'d2':'')+'"></i>')+esc(s.name)+'</button>'}).join('')+'</div>'}
function drawCharts(){
  var els=document.querySelectorAll('.cw');
  for(var k=0;k<els.length;k++){var el=els[k],cfg=CH[el.dataset.chart];if(!cfg)continue;var w=Math.max(260,Math.floor(el.clientWidth)||320),h=w<420?210:250;el._w=w;
    if(el.dataset.kind==='line'){var vis=cfg.series.filter(function(s){return !S.hide[el.dataset.chart+s.id]});
      var all=[];vis.forEach(function(s){all=all.concat(s.v)});if(!all.length)all=[cfg.min,cfg.max];
      var mn=cfg.min,mx=cfg.max;
      var svg=P.line({w:w,h:h,labels:cfg.labels,min:mn,max:mx,ticks:cfg.ticks||4,unit:cfg.unit,series:vis.map(function(s){return {v:s.v,cls:s.cls,area:s.cls==='l1'&&vis.length<3}}),alt:cfg.alt});
      el.innerHTML=svg.replace('</svg>','<line class="cur" x1="0" x2="0" y1="12" y2="'+(h-26)+'"/></svg>');
    }else{el.innerHTML=drawBars(cfg,w,h,el.dataset.chart)}
